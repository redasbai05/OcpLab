services:
  # === ZABBIX ===
  mysql:
    image: mysql:8.0
    container_name: zabbix-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd123
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbixpwd123
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ocp-lab

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-6.0-latest
    container_name: zabbix-server
    environment:
      DB_SERVER_HOST: mysql
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbixpwd123
      MYSQL_ROOT_PASSWORD: rootpwd123
    ports:
      - "10051:10051"
    depends_on:
      - mysql
    networks:
      - ocp-lab
  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-6.0-latest
    container_name: zabbix-web
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: mysql
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbixpwd123
      MYSQL_ROOT_PASSWORD: rootpwd123
      PHP_TZ: Africa/Casablanca
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - zabbix-server
    networks:
     - ocp-lab
  # === ÉQUIPEMENTS RÉSEAU (5 nœuds) ===
  router-edge:
    image: alpine:latest
    container_name: router-edge
    hostname: router-edge
    command: >
      sh -c "
        apk add --no-cache net-snmp openssh iproute2 &&
        echo 'root:ocp123' | chpasswd &&
        ssh-keygen -A &&
        sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config &&
        sed -i 's/#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config &&
        sed -i 's/UsePAM yes/UsePAM no/' /etc/ssh/sshd_config &&
        /usr/sbin/snmpd -Lsd -Lf /dev/null -p /var/run/snmpd -c /etc/snmp/snmpd.conf &&
        syslogd && /usr/sbin/sshd -D
      "
    volumes:
      - ./snmpd-router-edge.conf:/etc/snmp/snmpd.conf:ro
    networks:
      ocp-lab:
        ipv4_address: 172.20.0.10
    cap_add:
      - NET_ADMIN

  router-core:
    image: alpine:latest
    container_name: router-core
    hostname: router-core
    command: >
      sh -c "
        apk add --no-cache net-snmp openssh iproute2 &&
        echo 'root:ocp123' | chpasswd &&
        ssh-keygen -A &&
        sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config &&
        sed -i 's/#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config &&
        sed -i 's/UsePAM yes/UsePAM no/' /etc/ssh/sshd_config &&
        /usr/sbin/snmpd -Lsd -Lf /dev/null -p /var/run/snmpd -c /etc/snmp/snmpd.conf &&
        syslogd && /usr/sbin/sshd -D
      "
    volumes:
      - ./snmpd-router-core.conf:/etc/snmp/snmpd.conf:ro
    networks:
      ocp-lab:
        ipv4_address: 172.20.0.11
    cap_add:
      - NET_ADMIN

  router-site-a:
    image: alpine:latest
    container_name: router-site-a
    hostname: router-site-a
    command: >
      sh -c "
        apk add --no-cache net-snmp openssh iproute2 iptables &&
        echo 'root:ocp123' | chpasswd &&
        ssh-keygen -A &&
        sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config &&
        sed -i 's/#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config &&
        sed -i 's/UsePAM yes/UsePAM no/' /etc/ssh/sshd_config &&
        /usr/sbin/snmpd -Lsd -Lf /dev/null -p /var/run/snmpd -c /etc/snmp/snmpd.conf &&
        /usr/sbin/sshd -D
      "
    volumes:
      - ./snmpd-router-sitea.conf:/etc/snmp/snmpd.conf:ro
    networks:
      ocp-lab:
        ipv4_address: 172.20.0.12
    cap_add:
      - NET_ADMIN

  switch-site-a:
    image: alpine:latest
    container_name: switch-site-a
    hostname: switch-site-a
    command: >
      sh -c "
        apk add --no-cache net-snmp openssh iproute2 &&
        echo 'root:ocp123' | chpasswd &&
        ssh-keygen -A &&
        sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config &&
        sed -i 's/#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config &&
        sed -i 's/UsePAM yes/UsePAM no/' /etc/ssh/sshd_config &&
        /usr/sbin/snmpd -Lsd -Lf /dev/null -p /var/run/snmpd -c /etc/snmp/snmpd.conf &&
        syslogd && /usr/sbin/sshd -D
      "
    volumes:
      - ./snmpd-switch-sitea.conf:/etc/snmp/snmpd.conf:ro
    networks:
      ocp-lab:
        ipv4_address: 172.20.0.13
    cap_add:
      - NET_ADMIN

  switch-site-b:
    image: alpine:latest
    container_name: switch-site-b
    hostname: switch-site-b
    command: >
      sh -c "
        apk add --no-cache net-snmp openssh iproute2 &&
        echo 'root:ocp123' | chpasswd &&
        ssh-keygen -A &&
        sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config &&
        sed -i 's/#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config &&
        sed -i 's/UsePAM yes/UsePAM no/' /etc/ssh/sshd_config &&
        /usr/sbin/snmpd -Lsd -Lf /dev/null -p /var/run/snmpd -c /etc/snmp/snmpd.conf &&
        syslogd && /usr/sbin/sshd -D
      "
    volumes:
      - ./snmpd-switch-siteb.conf:/etc/snmp/snmpd.conf:ro
    networks:
      ocp-lab:
        ipv4_address: 172.20.0.14
    cap_add:
      - NET_ADMIN

  # === SCRIPTS D'AUTOMATISATION ===
  scenario1:
    build: .
    container_name: scenario1
    command: ["python", "-u", "scenario1_iptables.py"]
    volumes:
      - ./logs:/app/logs
    depends_on:
      - zabbix-web
      - router-edge
      - router-core
      - router-site-a
      - switch-site-a
      - switch-site-b
    networks:
      - ocp-lab

  scenario2:
    build: .
    container_name: scenario2
    command: ["python", "-u", "scenario2_route.py"]
    volumes:
      - ./logs:/app/logs
    depends_on:
      - router-edge
      - router-core
      - router-site-a
      - switch-site-a
      - switch-site-b
    networks:
      - ocp-lab

  scenario3:
    build: .
    container_name: scenario3
    command: ["python", "-u", "scenario3_syslog.py"]
    volumes:
      - ./logs:/app/logs
    depends_on:
      - router-edge
      - router-core
      - router-site-a
      - switch-site-a
      - switch-site-b
    networks:
      - ocp-lab

  snmp-collector:
    build: .
    container_name: snmp-collector
    command: ["python", "-u", "snmp_collector.py"]
    volumes:
      - ./logs:/app/logs
    depends_on:
      - zabbix-web
      - zabbix-server
    networks:
      - ocp-lab

volumes:
  mysql_data:

networks:
  ocp-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24